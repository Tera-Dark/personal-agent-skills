name: harness

# PRs validate source and build artifacts in the runner.
# Main commits regenerate bundle/; upstream tag sync is explicit.
on:
  push:
    branches: [main]
    paths-ignore:
      - "bundle/**"
      - "docs/skill-registry.md"
  pull_request:
  workflow_dispatch:
    inputs:
      sync_tag_index:
        description: "Refresh the pinned third-party Danbooru tag index"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skills and Python
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/check_personal_anima_regression.py
          python3 -m compileall -q scripts

      - name: Verify pinned tag snapshot (offline)
        run: |
          python3 scripts/build_tag_index.py --self-test
          python3 scripts/check_tag_index_snapshot.py

      - name: Explicit upstream tag refresh
        if: github.event_name == 'workflow_dispatch' && inputs.sync_tag_index
        run: python3 scripts/build_tag_index.py

      - name: Build and validate web bundles
        run: |
          python3 scripts/build.py
          python3 scripts/validate_skills.py --check-bundle
          python3 scripts/check_output_contract.py

      - name: Persist generated bundles
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- bundle docs/skill-registry.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bundle docs/skill-registry.md
            git commit -m "build: regenerate web harness $(cat VERSION) [skip ci]"
            git push
          else
            echo "Generated bundles already current."
          fi
