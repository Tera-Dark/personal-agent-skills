name: harness

# Validates every SKILL.md and keeps bundle/ in sync with the sources.
# - on pull requests: validate + fail if bundle/ would change (ask the author to run scripts/build.py)
# - on push to main:  validate + rebuild + commit the regenerated bundle back (so modules added
#                     through the GitHub web UI or from chat go live without a local toolchain)

on:
  push:
    branches: [main]
    paths-ignore:
      - "bundle/**"
      - "docs/skill-registry.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skills and scripts
        run: |
          python3 scripts/validate_skills.py
          python3 -m compileall -q scripts

      # build.py --check compares sources against bundle/ ignoring the build date,
      # so a rebuild on another day does not count as "stale" by itself.
      - name: Check whether bundle/ matches the sources
        id: check
        run: |
          if python3 scripts/build.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail PR if bundle is stale
        if: github.event_name == 'pull_request' && steps.check.outputs.stale == 'true'
        run: |
          echo "::error::bundle/ is out of date. Run: python3 scripts/build.py  and commit the result."
          exit 1

      - name: Rebuild and commit bundle
        if: github.event_name != 'pull_request' && steps.check.outputs.stale == 'true'
        run: |
          python3 scripts/build.py
          python3 scripts/validate_skills.py --check-bundle
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle docs/skill-registry.md
          git commit -m "build: regenerate bundle for $(cat VERSION) [skip ci]"
          git push
