name: One-time legacy branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-branch-pr-cleanup.yml"

permissions:
  contents: write

jobs:
  delete-legacy-branches:
    if: github.repository == 'Tera-Dark/personal-agent-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the approved legacy refs (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/artist-eye-crossmedia-v1"
            "feat/chatgpt-inspired-ui-skill"
            "feat/editorial-layout-composition-module"
            "feat/evidence-based-visual-taste-20261021"
            "feat/moss-image-renderer-v52"
            "feat/moss-official-prompt-enhancer-20261021"
            "feat/oct23-moss-fashion-camera-calibration"
            "feat/quantified-aesthetic-review-v1"
            "feat/session-taste-sync-20261015"
            "feat/v5-1-tiered-adaptive-quality"
            "refactor/generic-cinematic-lens-v5"
            "research/si-wooupp-visual-language"
          )
          failures=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" || -z "$branch" ]]; then
              echo "::error::Refusing to touch main or an empty branch ref"
              exit 1
            fi
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "DELETED: $branch"
            else
              echo "::error::FAILED: $branch"
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures branch deletions failed; inspect API errors"
            exit 1
          fi
          echo "All ${#branches[@]} legacy branches deleted; main untouched."
